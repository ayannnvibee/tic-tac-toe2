</button>

<svg class="w-12 h-12 text-tertiary-container animate-[bounce_0.4s_ease-out]" fill="none" viewbox="0 0 48 48">
<circle cx="24" cy="24" r="13" stroke="currentColor" stroke-linecap="round" stroke-width="7"></circle>
</svg>
</button>

<!-- Cell 6: Interactive empty tile -->

</button>
<!-- Cell 7: Interactive empty tile -->

<span class="w-3 h-3 rounded-full bg-outline-variant/30 opacity-60"></span>
</button>
<!-- Cell 8: Interactive empty tile -->
<button aria-label="Cell Bottom-Right: Empty" class="game-cell relative w-full h-full rounded-DEFAULT bg-surface-container-lowest flex items-center justify-center shadow-sm active:translate-y-1 transition-all" data-index="8">

<script>
(() => {
  // Local reactive micro-interaction state for the 3x3 showcase
  let boardState = ['X', null, null, null, 'O', null, null, null, null];
  let isXTurn = true;
  let p1Score = 0;
  let p2Score = 0;

  const cells = document.querySelectorAll('.game-cell');
  const turnBanner = document.getElementById('turn-banner');
  const turnText = document.getElementById('turn-text');
  const p1Card = document.getElementById('player-x-card');
  const p2Card = document.getElementById('player-o-card');
  const restartBtn = document.getElementById('btn-restart');
  const soundBtn = document.getElementById('btn-sound');

  const xSVG = `
    <svg class="w-12 h-12 text-secondary animate-[bounce_0.3s_ease-out]" viewBox="0 0 48 48" fill="none">
      <line x1="12" y1="12" x2="36" y2="36" stroke="currentColor" stroke-width="7" stroke-linecap="round" />
      <line x1="36" y1="12" x2="12" y2="36" stroke="currentColor" stroke-width="7" stroke-linecap="round" />
    </svg>`;

  const oSVG = `
    <svg class="w-12 h-12 text-tertiary-container animate-[bounce_0.3s_ease-out]" viewBox="0 0 48 48" fill="none">
      <circle cx="24" cy="24" r="13" stroke="currentColor" stroke-width="7" stroke-linecap="round" />
    </svg>`;

  function updateTurnUI() {
    if (isXTurn) {
      turnBanner.className = "inline-flex items-center gap-space-xs px-space-md py-1 rounded-full bg-secondary-fixed text-on-secondary-fixed shadow-sm";
      turnText.textContent = "Your Turn (X)";
      p1Card.className = "flex items-center gap-space-sm bg-secondary-fixed/30 rounded-DEFAULT p-space-sm relative transition-all duration-300 shadow-sm";
      p2Card.className = "flex items-center justify-end gap-space-sm bg-surface-container-low rounded-DEFAULT p-space-sm relative text-right transition-all duration-300";
    } else {
      turnBanner.className = "inline-flex items-center gap-space-xs px-space-md py-1 rounded-full bg-tertiary-fixed text-on-tertiary-fixed shadow-sm";
      turnText.textContent = "AI Thinking (O)...";
      p1Card.className = "flex items-center gap-space-sm bg-surface-container-low rounded-DEFAULT p-space-sm relative transition-all duration-300";
      p2Card.className = "flex items-center justify-end gap-space-sm bg-tertiary-fixed/30 rounded-DEFAULT p-space-sm relative text-right transition-all duration-300 shadow-sm";
    }
  }

  function handleCellClick(e) {
    const btn = e.currentTarget;
    const idx = parseInt(btn.getAttribute('data-index'), 10);
    if (boardState[idx] !== null) return;

    if (isXTurn) {
      boardState[idx] = 'X';
      btn.innerHTML = xSVG;
      btn.setAttribute('aria-label', `Cell marked X`);
      isXTurn = false;
      updateTurnUI();

      // Trigger automatic playful AI response if board is not full
      setTimeout(botMove, 450);
    }
  }

  function botMove() {
    const emptyIndices = boardState
      .map((val, idx) => (val === null ? idx : null))
      .filter(val => val !== null);

    if (emptyIndices.length === 0) return;

    // Pick random available tile
    const choice = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
    boardState[choice] = 'O';
    const cellEl = document.querySelector(`.game-cell[data-index="${choice}"]`);
    if (cellEl) {
      cellEl.innerHTML = oSVG;
      cellEl.setAttribute('aria-label', `Cell marked O`);
    }

    isXTurn = true;
    updateTurnUI();
  }

  cells.forEach(cell => {
    cell.addEventListener('click', handleCellClick);
  });

  restartBtn.addEventListener('click', () => {
    boardState = [null, null, null, null, null, null, null, null, null];
    cells.forEach(c => {
      c.innerHTML = '<span class="w-3 h-3 rounded-full bg-outline-variant/30 opacity-60"></span>';
      c.setAttribute('aria-label', 'Empty cell');
    });
    isXTurn = true;
    updateTurnUI();
  });

  let soundActive = true;
  soundBtn.addEventListener('click', () => {
    soundActive = !soundActive;
    soundBtn.querySelector('.font-label-md').textContent = soundActive ? 'SFX On' : 'SFX Muted';
    const icon = soundBtn.querySelector('.material-symbols-outlined');
    icon.textContent = soundActive ? 'music_note' : 'music_off';
    icon.className = soundActive ? 'material-symbols-outlined text-[22px] text-primary' : 'material-symbols-outlined text-[22px] text-outline';
  });
})();
