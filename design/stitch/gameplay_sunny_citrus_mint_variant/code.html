<!-- 3x3 Tactile Game Arena with Warm Porcelain White Tiles & Amber Drop Shadows -->
<div class="w-full flex justify-center items-center py-1">

<svg class="w-12 h-12 text-citrus-500 animate-[bounce_0.4s_ease-out]" fill="none" viewbox="0 0 48 48">
<line stroke="currentColor" stroke-linecap="round" stroke-width="7" x1="12" x2="36" y1="12" y2="36"></line>
<line stroke="currentColor" stroke-linecap="round" stroke-width="7" x1="36" x2="12" y1="12" y2="36"></line>
</svg>
</button>
<!-- Cell 1: Interactive empty tile -->
<button aria-label="Cell Top-Center: Empty" class="game-cell relative w-full h-full rounded-2xl bg-white border border-amber-100 flex items-center justify-center shadow-[0_4px_12px_rgba(217,119,6,0.1)] active:translate-y-1 hover:bg-amber-50/50 transition-all" data-index="1">
<span class="w-3 h-3 rounded-full bg-amber-300/40 opacity-70"></span>
</button>
<!-- Cell 2: Empty Tile with soft tap prompt cue -->
<button aria-label="Cell Top-Right: Empty" class="game-cell relative w-full h-full rounded-2xl bg-white border border-amber-100 flex items-center justify-center shadow-[0_4px_12px_rgba(217,119,6,0.1)] active:translate-y-1 transition-all group" data-index="2">
<span class="w-3.5 h-3.5 rounded-full bg-citrus-400/50 scale-100 group-hover:scale-125 transition-transform"></span>
</button>
<!-- Cell 3: Interactive empty tile -->
<button aria-label="Cell Middle-Left: Empty" class="game-cell relative w-full h-full rounded-2xl bg-white border border-amber-100 flex items-center justify-center shadow-[0_4px_12px_rgba(217,119,6,0.1)] active:translate-y-1 transition-all" data-index="3">
<span class="w-3 h-3 rounded-full bg-amber-300/40 opacity-70"></span>
</button>
<!-- Cell 4: Pre-filled O with Botanical Mint / Emerald ring -->
<button aria-label="Cell Center: Marked O" class="game-cell relative w-full h-full rounded-2xl bg-white border border-emerald-100 flex items-center justify-center shadow-[0_4px_12px_rgba(16,185,129,0.14)] active:translate-y-1 transition-all overflow-hidden" data-index="4">
<svg class="w-12 h-12 text-mint-500 animate-[bounce_0.4s_ease-out]" fill="none" viewbox="0 0 48 48">
<circle cx="24" cy="24" r="13" stroke="currentColor" stroke-linecap="round" stroke-width="7"></circle>
</svg>
</button>
<!-- Cell 5: Interactive empty tile -->
<button aria-label="Cell Middle-Right: Empty" class="game-cell relative w-full h-full rounded-2xl bg-white border border-amber-100 flex items-center justify-center shadow-[0_4px_12px_rgba(217,119,6,0.1)] active:translate-y-1 transition-all" data-index="5">
<span class="w-3 h-3 rounded-full bg-amber-300/40 opacity-70"></span>
</button>
<!-- Cell 6: Interactive empty tile -->
<button aria-label="Cell Bottom-Left: Empty" class="game-cell relative w-full h-full rounded-2xl bg-white border border-amber-100 flex items-center justify-center shadow-[0_4px_12px_rgba(217,119,6,0.1)] active:translate-y-1 transition-all" data-index="6">
<span class="w-3 h-3 rounded-full bg-amber-300/40 opacity-70"></span>
</button>
<!-- Cell 7: Interactive empty tile -->
<button aria-label="Cell Bottom-Center: Empty" class="game-cell relative w-full h-full rounded-2xl bg-white border border-amber-100 flex items-center justify-center shadow-[0_4px_12px_rgba(217,119,6,0.1)] active:translate-y-1 transition-all" data-index="7">
<span class="w-3 h-3 rounded-full bg-amber-300/40 opacity-70"></span>
</button>
<!-- Cell 8: Interactive empty tile -->
<button aria-label="Cell Bottom-Right: Empty" class="game-cell relative w-full h-full rounded-2xl bg-white border border-amber-100 flex items-center justify-center shadow-[0_4px_12px_rgba(217,119,6,0.1)] active:translate-y-1 transition-all" data-index="8">
<span class="w-3 h-3 rounded-full bg-amber-300/40 opacity-70"></span>
</button>

</div>
</div>
<!-- Bottom Tip Card (Soft Mint/Lime Oasis container) -->
<div class="mt-3.5 w-full bg-gradient-to-r from-emerald-50 via-teal-50/70 to-lime-50 border border-emerald-200/80 rounded-2xl p-3 flex items-center gap-3 shadow-sm">
<div class="w-10 h-10 rounded-full bg-gradient-to-br from-mint-500 to-emerald-600 text-white flex items-center justify-center flex-shrink-0 shadow-md shadow-emerald-500/25">

</div>

<p class="text-[13px] font-extrabold text-emerald-950 truncate">First to get 3-in-a-row unlocks 4×4 Infinity grid!</p>
<span class="text-[11px] font-bold text-emerald-700">Round 1 of 3 to advance</span>

<!-- Quick Action Controls Floor with 3D Bevel Indigo Buttons -->

<!-- Sound Toggle Mini Button -->

<span class="material-symbols-outlined text-[22px] text-citrus-600 font-bold">music_note</span>
<span class="text-[13px] font-black">SFX On</span>
</button>

</button>

<span class="material-symbols-outlined text-[22px] text-mint-600 font-bold">psychology</span>
</button>

<script>
(() => {
  // Local reactive micro-interaction state for the 3x3 showcase
  let boardState = ['X', null, null, null, 'O', null, null, null, null];
  let isXTurn = true;
  let p1Score = 0;
  let p2Score = 0;

  const cells = document.querySelectorAll('.game-cell');
  const turnBanner = document.getElementById('turn-banner');
  const turnText = document.getElementById('turn-text');
  const p1Card = document.getElementById('player-x-card');
  const p2Card = document.getElementById('player-o-card');
  const restartBtn = document.getElementById('btn-restart');
  const soundBtn = document.getElementById('btn-sound');

  // Tangerine X SVG
  const xSVG = `
    <svg class="w-12 h-12 text-citrus-500 animate-[bounce_0.3s_ease-out]" viewBox="0 0 48 48" fill="none">
      <line x1="12" y1="12" x2="36" y2="36" stroke="currentColor" stroke-width="7" stroke-linecap="round" />
      <line x1="36" y1="12" x2="12" y2="36" stroke="currentColor" stroke-width="7" stroke-linecap="round" />
    </svg>`;

  // Emerald/Mint O SVG
  const oSVG = `
    <svg class="w-12 h-12 text-mint-500 animate-[bounce_0.3s_ease-out]" viewBox="0 0 48 48" fill="none">
      <circle cx="24" cy="24" r="13" stroke="currentColor" stroke-width="7" stroke-linecap="round" />
    </svg>`;

  function updateTurnUI() {
    if (isXTurn) {
      turnBanner.className = "inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-citrus-100 border border-citrus-400/50 text-citrus-700 shadow-sm font-extrabold";
      turnText.textContent = "Your Turn (X)";
      p1Card.className = "flex items-center gap-2.5 bg-gradient-to-r from-amber-500/15 to-amber-50 border-2 border-citrus-500/30 rounded-xl p-2.5 relative transition-all duration-300 shadow-sm";
      p2Card.className = "flex items-center justify-end gap-2.5 bg-slate-50 border border-slate-200/70 rounded-xl p-2.5 relative text-right transition-all duration-300";
    } else {
      turnBanner.className = "inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-emerald-100 border border-mint-500/40 text-emerald-800 shadow-sm font-extrabold";
      turnText.textContent = "AI Thinking (O)...";
      p1Card.className = "flex items-center gap-2.5 bg-slate-50 border border-slate-200/70 rounded-xl p-2.5 relative transition-all duration-300";
      p2Card.className = "flex items-center justify-end gap-2.5 bg-gradient-to-l from-emerald-500/15 to-emerald-50 border-2 border-mint-500/30 rounded-xl p-2.5 relative text-right transition-all duration-300 shadow-sm";
    }
  }

  function handleCellClick(e) {
    const btn = e.currentTarget;
    const idx = parseInt(btn.getAttribute('data-index'), 10);
    if (boardState[idx] !== null) return;

    if (isXTurn) {
      boardState[idx] = 'X';
      btn.innerHTML = xSVG;
      btn.setAttribute('aria-label', `Cell marked X`);
      isXTurn = false;
      updateTurnUI();

      // Trigger automatic playful AI response if board is not full
      setTimeout(botMove, 450);
    }
  }

  function botMove() {
    const emptyIndices = boardState
      .map((val, idx) => (val === null ? idx : null))
      .filter(val => val !== null);

    if (emptyIndices.length === 0) return;

    // Pick random available tile
    const choice = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
    boardState[choice] = 'O';
    const cellEl = document.querySelector(`.game-cell[data-index="${choice}"]`);
    if (cellEl) {
      cellEl.innerHTML = oSVG;
      cellEl.setAttribute('aria-label', `Cell marked O`);
    }

    isXTurn = true;
    updateTurnUI();
  }

  cells.forEach(cell => {
    cell.addEventListener('click', handleCellClick);
  });

  restartBtn.addEventListener('click', () => {
    boardState = [null, null, null, null, null, null, null, null, null];
    cells.forEach(c => {
      c.innerHTML = '<span class="w-3 h-3 rounded-full bg-amber-300/40 opacity-70"></span>';
      c.setAttribute('aria-label', 'Empty cell');
    });
    isXTurn = true;
    updateTurnUI();
  });

  let soundActive = true;
  soundBtn.addEventListener('click', () => {
    soundActive = !soundActive;
    soundBtn.querySelector('span:nth-child(2)').textContent = soundActive ? 'SFX On' : 'SFX Muted';
    const icon = soundBtn.querySelector('.material-symbols-outlined');
    icon.textContent = soundActive ? 'music_note' : 'music_off';
    icon.className = soundActive ? 'material-symbols-outlined text-[22px] text-citrus-600 font-bold' : 'material-symbols-outlined text-[22px] text-slate-400 font-bold';
  });
})();
</script></main></body></html>
