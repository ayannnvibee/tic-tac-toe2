<script>
(() => {
  // Local reactive micro-interaction state for the 3x3 showcase
  let boardState = ['X', null, null, null, 'O', null, null, null, null];
  let isXTurn = true;
  let p1Score = 0;
  let p2Score = 0;

  const cells = document.querySelectorAll('.game-cell');
  const turnBanner = document.getElementById('turn-banner');
  const turnText = document.getElementById('turn-text');
  const p1Card = document.getElementById('player-x-card');
  const p2Card = document.getElementById('player-o-card');
  const restartBtn = document.getElementById('btn-restart');
  const soundBtn = document.getElementById('btn-sound');

  // Vibrant Electric Indigo Cross
  const xSVG = `
    <svg class="w-12 h-12 text-[#4F46E5] animate-[bounce_0.3s_ease-out] drop-shadow-[0_4px_8px_rgba(79,70,229,0.3)]" viewBox="0 0 48 48" fill="none">
      <line x1="12" y1="12" x2="36" y2="36" stroke="currentColor" stroke-width="7.5" stroke-linecap="round" />
      <line x1="36" y1="12" x2="12" y2="36" stroke="currentColor" stroke-width="7.5" stroke-linecap="round" />
    </svg>`;

  // Fiery Sunset Coral Double-Ring
  const oSVG = `
    <svg class="w-12 h-12 text-[#FF5757] animate-[bounce_0.3s_ease-out] drop-shadow-[0_4px_10px_rgba(255,87,87,0.35)]" viewBox="0 0 48 48" fill="none">
      <circle cx="24" cy="24" r="15" stroke="currentColor" stroke-width="2.5" opacity="0.3" stroke-linecap="round" />
      <circle cx="24" cy="24" r="12" stroke="currentColor" stroke-width="7" stroke-linecap="round" />
    </svg>`;

  function updateTurnUI() {
    if (isXTurn) {
      turnBanner.className = "inline-flex items-center gap-space-xs px-space-md py-1.5 rounded-full bg-gradient-to-r from-[#4F46E5] via-[#6366F1] to-[#FF5757] text-white shadow-md shadow-indigo-500/25 border border-white/30";
      turnText.textContent = "YOUR TURN (X)";
      p1Card.className = "flex items-center gap-space-sm bg-gradient-to-br from-indigo-50/90 to-indigo-100/50 border border-indigo-200/70 rounded-xl p-space-sm relative transition-all duration-300 shadow-[0_2px_8px_rgba(79,70,229,0.08)]";
      p2Card.className = "flex items-center justify-end gap-space-sm bg-rose-50/40 border border-rose-100/50 rounded-xl p-space-sm relative text-right transition-all duration-300";
    } else {
      turnBanner.className = "inline-flex items-center gap-space-xs px-space-md py-1.5 rounded-full bg-gradient-to-r from-[#FF5757] to-[#F43F5E] text-white shadow-md shadow-rose-500/25 border border-white/30";
      turnText.textContent = "AI THINKING (O)...";
      p1Card.className = "flex items-center gap-space-sm bg-indigo-50/40 border border-indigo-100/50 rounded-xl p-space-sm relative transition-all duration-300";
      p2Card.className = "flex items-center justify-end gap-space-sm bg-gradient-to-br from-rose-50/90 to-rose-100/60 border border-rose-200/70 rounded-xl p-space-sm relative text-right transition-all duration-300 shadow-[0_2px_8px_rgba(255,87,87,0.12)]";
    }
  }

  function handleCellClick(e) {
    const btn = e.currentTarget;
    const idx = parseInt(btn.getAttribute('data-index'), 10);
    if (boardState[idx] !== null) return;

    if (isXTurn) {
      boardState[idx] = 'X';
      btn.innerHTML = xSVG;
      btn.setAttribute('aria-label', `Cell marked X`);
      isXTurn = false;
      updateTurnUI();

      // Trigger automatic playful AI response if board is not full
      setTimeout(botMove, 450);
    }
  }

  function botMove() {
    const emptyIndices = boardState
      .map((val, idx) => (val === null ? idx : null))
      .filter(val => val !== null);

    if (emptyIndices.length === 0) return;

    // Pick random available tile
    const choice = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
    boardState[choice] = 'O';
    const cellEl = document.querySelector(`.game-cell[data-index="${choice}"]`);
    if (cellEl) {
      cellEl.innerHTML = oSVG;
      cellEl.setAttribute('aria-label', `Cell marked O`);
    }

    isXTurn = true;
    updateTurnUI();
  }

  cells.forEach(cell => {
    cell.addEventListener('click', handleCellClick);
  });

  restartBtn.addEventListener('click', () => {
    boardState = [null, null, null, null, null, null, null, null, null];
    cells.forEach(c => {
      c.innerHTML = '<span class="w-3 h-3 rounded-full bg-indigo-200/50"></span>';
      c.setAttribute('aria-label', 'Empty cell');
    });
    isXTurn = true;
    updateTurnUI();
  });

  let soundActive = true;
  soundBtn.addEventListener('click', () => {
    soundActive = !soundActive;
    soundBtn.querySelector('.font-label-md').textContent = soundActive ? 'SFX On' : 'SFX Muted';
    const icon = soundBtn.querySelector('.material-symbols-outlined');
    icon.textContent = soundActive ? 'music_note' : 'music_off';
    icon.className = soundActive ? 'material-symbols-outlined text-[22px] text-[#4F46E5]' : 'material-symbols-outlined text-[22px] text-slate-400';
  });
})();
</script></main></body></html>
