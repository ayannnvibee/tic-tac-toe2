<!-- Client Micro-Interactions Script -->
<script>
  (function() {
    // Sound Toggle State
    const soundBtn = document.getElementById('soundToggle');
    const soundIcon = document.getElementById('soundIcon');
    let soundEnabled = true;

    if (soundBtn && soundIcon) {
      soundBtn.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        if (soundEnabled) {
          soundIcon.innerText = 'volume_up';
          soundBtn.querySelector('span:last-child').innerText = 'SFX ON';
          soundIcon.classList.add('text-primary');
          soundIcon.classList.remove('text-outline');
        } else {
          soundIcon.innerText = 'volume_off';
          soundBtn.querySelector('span:last-child').innerText = 'MUTED';
          soundIcon.classList.remove('text-primary');
          soundIcon.classList.add('text-outline');
        }
      });
    }

    // Gentle tactile feedback on Play Click
    const playBtn = document.getElementById('playBtn');
    if (playBtn) {
      playBtn.addEventListener('click', () => {
        playBtn.classList.add('scale-95');
        setTimeout(() => playBtn.classList.remove('scale-95'), 140);
      });
    }
  })();
